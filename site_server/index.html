<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft Market - Marketplace Gaming</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-cube"></i>
            <span>Craft Market</span>
        </div>
        
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" placeholder="Caută arme magice, blocuri, resurse, vânzători...">
        </div>

        <div class="header-actions">
            <button class="btn btn-danger" id="openDeleteModalBtn">
                <i class="fa-solid fa-trash"></i> Șterge un Anunț
            </button>
            <button class="btn btn-primary" id="openAddModalBtn">
                <i class="fa-solid fa-plus"></i> Adaugă Anunț
            </button>
            <button class="btn btn-secondary" id="openProfileBtn">
                <i class="fa-solid fa-user"></i> Profil
            </button>
        </div>
    </header>

    <!-- Category Filters -->
    <div class="categories-wrapper">
        <div class="categories-container">
            <button class="category-btn active" data-category="all"><i class="fa-solid fa-fire"></i> Populare</button>
            <button class="category-btn" data-category="Netherite"><i class="fa-solid fa-gem"></i> Netherite</button>
            <button class="category-btn" data-category="Beacon"><i class="fa-solid fa-bolt"></i> Beacon</button>
            <button class="category-btn" data-category="Elytra"><i class="fa-solid fa-feather"></i> Elytra</button>
            <button class="category-btn" data-category="Shulker Box"><i class="fa-solid fa-box"></i> Shulker Box</button>
            <button class="category-btn" data-category="Armuri & Unelte"><i class="fa-solid fa-shield-halved"></i> Armuri & Unelte</button>
            <button class="category-btn" data-category="Resurse & Minerale"><i class="fa-solid fa-pickaxe"></i> Resurse & Minerale</button>
            <button class="category-btn" data-category="Terenuri & Zone"><i class="fa-solid fa-map"></i> Terenuri & Zone</button>
            <button class="category-btn" data-category="Servicii & Enchant-uri"><i class="fa-solid fa-wand-magic-sparkles"></i> Servicii & Enchant-uri</button>
        </div>
        <button class="btn btn-reset" id="resetSearchBtn"><i class="fa-solid fa-rotate-left"></i> Resetare Căutare</button>
    </div>

    <!-- Security Banner -->
    <div class="security-banner">
        <i class="fa-solid fa-shield-cat"></i>
        <span>Piață securizată prin comerț cu Diamante Minecraft</span>
    </div>

    <!-- Main Content Grid -->
    <main class="main-container">
        <h2>Anunțuri Recente</h2>
        <div class="ads-grid" id="adsGrid">
            <!-- Dynamic cards will be rendered here -->
        </div>
    </main>

    <!-- Modal: Adaugă Anunț -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-plus-circle"></i> Adaugă un Anunț Nou</h3>
                <button class="close-btn" id="closeAddModal">&times;</button>
            </div>
            <form id="addAdForm">
                <div class="form-group">
                    <label for="adTitle">Titlu Anunț *</label>
                    <input type="text" id="adTitle" placeholder="ex: Târnăcop Netherite Eficiență V" required>
                </div>
                <div class="form-group">
                    <label for="adCategory">Categorie *</label>
                    <select id="adCategory" required>
                        <option value="Netherite">Netherite</option>
                        <option value="Beacon">Beacon</option>
                        <option value="Elytra">Elytra</option>
                        <option value="Shulker Box">Shulker Box</option>
                        <option value="Armuri & Unelte">Armuri & Unelte</option>
                        <option value="Resurse & Minerale">Resurse & Minerale</option>
                        <option value="Terenuri & Zone">Terenuri & Zone</option>
                        <option value="Servicii & Enchant-uri">Servicii & Enchant-uri</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="adPrice">Preț (Diamante/Smaragde) *</label>
                    <input type="text" id="adPrice" placeholder="ex: 32 Diamante" required>
                </div>
                <div class="form-group">
                    <label for="adDescription">Descriere Anunț *</label>
                    <textarea id="adDescription" rows="4" placeholder="Oferă detalii despre produs, durabilitate, enchant-uri etc." required></textarea>
                </div>
                <div class="form-group">
                    <label for="adImage">Imagine Produs</label>
                    <input type="file" id="adImage" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="adAuthor">Numele Tău (Utilizator) *</label>
                    <input type="text" id="adAuthor" placeholder="ex: AlexPro123" required>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary btn-full"><i class="fa-solid fa-check"></i> Publică Anunțul</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Șterge Anunț -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-trash"></i> Gestionare / Ștergere Anunțuri</h3>
                <button class="close-btn" id="closeDeleteModal">&times;</button>
            </div>
            <div id="deleteAdsList" class="delete-ads-list">
                <!-- Delete list rendered dynamically -->
            </div>
        </div>
    </div>

    <!-- Modal: Profil -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-id-card"></i> Profil Utilizator</h3>
                <button class="close-btn" id="closeProfileModal">&times;</button>
            </div>
            <div class="profile-card">
                <div class="profile-avatar">
                    <i class="fa-solid fa-user-ninja"></i>
                </div>
                <h3 id="profileUsername">Steve_Craft</h3>
                <p class="profile-stat">Anunțuri postate: <span id="profileAdCount" class="badge">0</span></p>
                <div class="profile-info">
                    <p><i class="fa-solid fa-shield-halved"></i> Statut: <strong>Jucător Verificat</strong></p>
                    <p><i class="fa-solid fa-star"></i> Reputație: <strong>5.0 / 5.0</strong></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
